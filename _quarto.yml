project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - site/pages/foundations.qmd
    - site/pages/reading.qmd
    - site/pages/laboratory.qmd
    - site/pages/commuting.ipynb
    - site/pages/evidence.qmd
    - site/pages/faq.qmd
    - site/pages/updates.qmd
    - site/pages/about.qmd
  resources:
    - site/pages/laboratory.ipynb
    - site/pages/commuting.ipynb
    - articles/p05-commuting-qsm/code/*.py
    - articles/p05-commuting-qsm/data/*.csv
    - articles/p05-commuting-qsm/results/reference/*
    - articles/p05-commuting-qsm/prompts/*.md
    - articles/p05-commuting-qsm/*.md
    - articles/p05-commuting-qsm/requirements.txt
    - articles/p05-commuting-qsm/downloads/*.zip
    - articles/p05-commuting-qsm/downloads/*.ipynb
    - figs/raw/*
    - articles/**/figures/*
    - articles/p04-minimal-qsm/code/*.py
    - articles/p04-minimal-qsm/data/*.csv
    - articles/p04-minimal-qsm/results/reference/*
    - articles/p04-minimal-qsm/prompts/*.txt

website:
  title: "QSM 基础"
  site-url: https://lianxhcn.github.io/qsm101/
  favicon: figs/raw/qsm-course-fig01-logo-20261005-152554.ico
  page-navigation: true
  search: true
  navbar:
    logo: figs/raw/qsm-course-fig01-logo-20261005-152554.svg
    logo-alt: "QSM 基础"
    left:
      - text: "从这里开始"
        href: index.qmd
      - text: "QSM 基础"
        href: site/pages/foundations.qmd
      - text: "学习路线"
        href: site/pages/reading.qmd
      - text: "两地区模型"
        href: site/pages/laboratory.qmd
      - text: "顶刊案例"
        href: site/pages/evidence.qmd
      - text: "常见问题"
        href: site/pages/faq.qmd
    right:
      - text: "课程主页 ↗"
        href: https://www.lianxh.cn/qsm.html
      - icon: github
        href: https://github.com/lianxhcn/qsm101
        aria-label: "GitHub 仓库"
  sidebar:
    style: floating
    contents:
      - text: "学习起点"
        href: index.qmd
      - section: "建立基础"
        contents:
          - text: "什么是 QSM"
            href: site/pages/foundations.qmd
          - text: "文献与学习路线"
            href: site/pages/reading.qmd
      - section: "两地区模型"
        contents:
          - text: "搭建、校准与求解"
            href: site/pages/laboratory.qmd
          - text: "居住、就业与通勤"
            href: site/pages/commuting.ipynb
      - section: "进入论文"
        contents:
          - text: "柏林墙研究"
            href: site/pages/evidence.qmd
      - section: "使用本站"
        contents:
          - text: "常见问题"
            href: site/pages/faq.qmd
          - text: "更新记录"
            href: site/pages/updates.qmd
          - text: "关于本站"
            href: site/pages/about.qmd
  page-footer:
    left: "QSM 基础 · 连享会"
    right: "[课程主页](https://www.lianxh.cn/qsm.html) · [关于本站](https://lianxhcn.github.io/qsm101/site/pages/about.html)"

format:
  html:
    theme: cosmo
    fontsize: 18px
    grid:
      # Quarto includes two 24px gutters: usable text width is 800px.
      body-width: 848px
      sidebar-width: 240px
      margin-width: 220px
      gutter-width: 24px
    lightbox: true
    css: site/styles.css
    include-after-body: site/callout-copy.html
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    lang: zh-CN

execute:
  enabled: false
