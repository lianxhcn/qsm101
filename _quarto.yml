format:
  html:
    code-fold: true
    code-summary: "查看或复制 Python 代码"
    theme: cosmo
    fontsize: 18px
    grid:
      # Quarto includes two 24px gutters: usable text width is 800px.
      body-width: 848px
      sidebar-width: 240px
      margin-width: 220px
      gutter-width: 24px
    lightbox: true
    css: site/styles.css
    include-after-body: site/callout-copy.html
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    lang: zh-CN
    crossref:
      fig-title: 图
      tbl-title: 表
      fig-prefix: 图
      tbl-prefix: 表
      eq-prefix: 式

execute:
  enabled: false
