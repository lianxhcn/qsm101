name: Publish QSM site

on:
  push:
    branches: [main]
    paths:
      - '_quarto.yml'
      - 'index.qmd'
      - 'site/**'
      - 'figs/**'
      - 'articles/**'
      - 'docs/**'
      - 'course/**'
      - 'references/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
      - name: Render website
        run: quarto render
      - name: Check pages, links, figures, and course entry
        run: python3 -B site/check_site.py --prompt-contract strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
