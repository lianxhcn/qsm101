<script>
// 纯文本提示词没有 Quarto 原生代码复制按钮，在标题栏提供键盘可用的入口。
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".agent-prompt").forEach((box) => {
    const code = box.querySelector("pre code");
    const header = box.querySelector(".callout-header");
    if (!code || !header || header.querySelector(".prompt-copy-button")) return;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "prompt-copy-button";
    button.textContent = "复制提示词";
    button.setAttribute("aria-live", "polite");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(code.textContent);
        button.textContent = "已复制";
      } catch (_) {
        // 不把剪贴板失败当作成功；选中文字供读者手动复制。
        const range = document.createRange();
        range.selectNodeContents(code);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        button.textContent = "已选中，请手动复制";
      }
      window.setTimeout(() => { button.textContent = "复制提示词"; }, 2500);
    });
    header.appendChild(button);
  });
});
</script>

<script>
// 只给超出容器的公式提示滚动；不改公式内容或缩小数学字形。
window.addEventListener("load", () => {
  const ready = window.MathJax?.startup?.promise || Promise.resolve();
  ready.then(() => {
    document.querySelectorAll("main .math.display").forEach((formula) => {
      const hint = document.createElement("span");
      hint.className = "math-scroll-hint";
      hint.textContent = "左右滑动查看完整公式";
      hint.hidden = true;
      formula.after(hint);
      const update = () => {
        const overflow = formula.scrollWidth > formula.clientWidth + 1;
        hint.hidden = !overflow;
        if (overflow) {
          formula.setAttribute("tabindex", "0");
          formula.setAttribute("role", "region");
          formula.setAttribute("aria-label", "公式，可左右滚动查看完整内容");
        } else {
          formula.removeAttribute("tabindex");
          formula.removeAttribute("role");
          formula.removeAttribute("aria-label");
        }
      };
      new ResizeObserver(update).observe(formula);
      update();
    });
  });
});
</script>
